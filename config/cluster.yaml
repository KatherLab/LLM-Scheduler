# KatherLab cluster topology.
#
# gpu / dgx    shared partitions. Slurm's backfill decides start time, so
#              bookings show as estimates, never confirmed slots.
# llm / spark  restricted to llm-hosting / llm-admins. Our calendar is the
#              allocator, so bookings there are real promises (--begin +
#              --nodelist + typed --gres).
#
# gpu / dgx carry scale_out: true and are opt-in only (hidden from the
# timeline and from automatic placement until named explicitly).
#
# GPU class names must match slurm.conf: job_submit.lua validates and
# rewrites --gres against them, and appends gpu24 as a hard constraint to any
# untyped --gres=gpu:N.

runtimes:
  # x86_64. `image` is a filename glob matched against APPTAINER_IMAGE_DIR —
  # not one pinned file, so several versions can coexist; a booking picks the
  # newest unless it names one explicitly. Build with the Images panel.
  x86-cuda:
    kind: apptainer
    image: "vllm-*-x86_64.sif"
    nv: true
    binds:
      - /mnt/copernicus0/llm-scheduler
    env:
      HF_HOME: /mnt/copernicus0/llm-scheduler/hf-cache
      HF_HUB_OFFLINE: "0"
      VLLM_CACHE_ROOT: /mnt/copernicus0/llm-scheduler/vllm-cache

  # aarch64 — DGX Spark (gb10). Same glob-based version selection.
  arm-vllm:
    kind: apptainer
    image: "vllm-*-aarch64.sif"
    nv: true
    binds:
      - /mnt/copernicus0/llm-scheduler
    env:
      HF_HOME: /mnt/copernicus0/llm-scheduler/hf-cache
      HF_HUB_OFFLINE: "0"
      # Required on GB10: works around an ld.so static-TLS crash when --nv's
      # host CUDA libraries load next to the container's.
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2097152
      VLLM_CACHE_ROOT: /mnt/copernicus0/llm-scheduler/vllm-cache

gpu_classes:
  # rtx_6000 (curie), rtx_a5000 (europa), rtx_3090 (alien0/1),
  # rtx_pro_6000 MIG slices (ganymede — 8x 1g)
  gpu24:
    vram_gb: 24
    arch: x86_64
    runtime: x86-cuda
    models: [rtx_6000, rtx_a5000, rtx_3090, rtx_pro_6000]

  # rtx_6000_ada (titan, luna), rtx_a6000 (io, callisto), l40 (europa)
  gpu48:
    vram_gb: 48
    arch: x86_64
    runtime: x86-cuda
    models: [rtx_6000_ada, rtx_a6000, l40]

  # a100 (dgx) — only reachable in the dgx partition.
  gpu80:
    vram_gb: 80
    arch: x86_64
    runtime: x86-cuda
    models: [a100]
    guard_gap_seconds: 180

  # rtx_pro_6000 (jupiter)
  gpu96:
    vram_gb: 96
    arch: x86_64
    runtime: x86-cuda
    models: [rtx_pro_6000]
    guard_gap_seconds: 180

  # H200 — sv-ekfz-cai-h200, llm partition. vram_gb 140 is what the driver
  # reports (143771 MiB), not the marketing 141.
  gpu141:
    vram_gb: 140
    arch: x86_64
    runtime: x86-cuda
    models: [h200]
    reserved_gb: 3
    guard_gap_seconds: 300

  # DGX Spark (GB10) — spark-049c, spark-c127. RAM is VRAM: reserved_gb is
  # what the host needs, gpu_memory_utilization_max is a hard ceiling on top.
  gb10:
    vram_gb: 119
    arch: aarch64
    runtime: arm-vllm
    unified_memory: true
    reserved_gb: 24
    gpu_memory_utilization_max: 0.80
    models: [gb10]
    guard_gap_seconds: 180

pools:
  # Shared research partition, opt-in. Slurm decides; estimate only.
  - name: general
    partition: gpu
    scheduling: slurm
    scale_out: true

  # A100 box, opt-in. job_submit.lua restricts gpu80 to this partition.
  - name: dgx
    partition: dgx
    scheduling: slurm
    scale_out: true
    gpu_classes: [gpu80]

  # DGX Spark, exclusive.
  - name: spark
    partition: spark
    scheduling: managed
    gpu_classes: [gb10]

  # sv-ekfz-cai-h200 (8x gpu141) and vega (1x gpu48, also a login host), both
  # exclusive to llm-hosting.
  - name: llm
    partition: llm
    scheduling: managed
    operators: [llm-admins]
    gpu_classes: [gpu141, gpu48]

quotas:
  # Uncomment to enforce booking limits on the exclusive pools.
  # default:
  #   max_concurrent_gpus: 4
  #   max_gpu_hours_inflight: 96
  #   max_booking_horizon_days: 14
  #   max_booking_duration_hours: 48
  # groups:
  #   llm-power-users: {max_concurrent_gpus: 8}
