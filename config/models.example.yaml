# Applied to every model below. Per-model values win: a scalar replaces the
# default, `env` merges key-by-key, and in extra_args/tool_args a default flag
# is dropped when the model sets the same flag (overridden, not duplicated).
# Keep this to flags that make sense cluster-wide — things like
# --max-model-len belong on the individual model, or nowhere at all if the
# model's own default context length should be used.
defaults:
  extra_args: "--enable-prompt-tokens-details"
  venv_activate: /path/to/.venv/bin/activate
  env:
    HF_HUB_OFFLINE: "1"

models:
  - name: Qwen3-0.6B-FP8
    model_path: Qwen/Qwen3-0.6B-FP8
    tags: [reasoning]
    gpus: 1
    tensor_parallel_size: 1
    cpus: 4
    mem: "16G"
    gpu_memory_utilization: 0.1
    reasoning_parser: deepseek_r1
    extra_args: "--max-num-seqs 10 --enforce-eager --max-model-len 2048"
    venv_activate: /path/to/.venv/bin/activate
    notes: "small test model"
    env:
      VLLM_SOME_FLAG: "1"

  # Example for 4x H200
  - name: Qwen3.5-397B-A17B-FP8
    model_path: Qwen/Qwen3.5-397B-A17B-FP8
    gpus: 4
    tensor_parallel_size: 4
    cpus: 32
    mem: "500G"
    gpu_memory_utilization: 0.95
    extra_args: >
      --mm-processor-cache-gb 10
      --enable-prefix-caching
      --max-num-batched-tokens 16384
    reasoning_parser: qwen3
    tags: [vision,reasoning]
    tool_args: "--enable-auto-tool-choice --tool-call-parser qwen3_coder"
    venv_activate: /path/to/vllm-nightly/.venv/bin/activate
  # ── Co-location ───────────────────────────────────────────────────────────
  # Small models can share one GPU. Book with:
  #   POST /admin/leases {"model": "bge-m3", "colocate": ["bge-reranker-v2"]}
  #
  # Slurm grants ONE GPU and the job runs both servers inside it, each on its
  # own port, each registering as a normal endpoint. Routing, health checks and
  # metrics are unchanged.
  #
  # `memory_gb` is REQUIRED for co-location and is the whole point: absolute
  # budgets add up, fractions of a shared card do not. The group is proven to
  # fit before submission.
  #
  # Trade-offs: co-tenants share one Slurm job (they stop together), and the
  # GPU time-slices between them — fine for embedding/reranking, but it will
  # quietly invalidate benchmark numbers.
  #
  # - name: bge-m3
  #   model_path: BAAI/bge-m3
  #   gpus: 1
  #   tensor_parallel_size: 1
  #   memory_gb: 12
  #   tags: [embedding]
  #
  # - name: bge-reranker-v2
  #   model_path: BAAI/bge-reranker-v2-m3
  #   gpus: 1
  #   tensor_parallel_size: 1
  #   memory_gb: 8
  #   tags: [reranker]

  # ── A model that needs a whole HGX H200 node ──────────────────────────────
  # `min_vram_gb` is the per-GPU floor (one TP shard + its KV cache).
  # `min_total_vram_gb` is the aggregate floor — WITHOUT it, `min_vram_gb: 140`
  # is satisfied by a *single* H200, so a booking for 2 GPUs would queue, wait,
  # allocate, and only then OOM at load.
  #
  # The `variants` entry is what actually sizes it; `requires` is the guard that
  # catches a wrong per-lease override.
  #
  # - name: DeepSeek-V3
  #   model_path: deepseek-ai/DeepSeek-V3
  #   gpus: 8
  #   tensor_parallel_size: 8
  #   requires:
  #     gpu_classes: [gpu141]       # nothing else will do
  #     min_vram_gb: 140
  #     min_total_vram_gb: 1000
  #   variants:
  #     gpu141: {gpus: 8, tp: 8, gpu_memory_utilization: 0.92}
  #   cpus: 64
  #   mem: "900G"
