# Local development on macOS + Podman.
#
# The Podman VM has only a default route via gvproxy, so it cannot reach the
# cluster network directly (your VPN routes live on the Mac, not in the VM).
# An SSH tunnel on the Mac bridges the gap:
#
#   ssh -f -N -L 0.0.0.0:16820:localhost:6820 \
#             -L 0.0.0.0:12222:localhost:22 \
#             <you>@192.168.33.25
#
# None of this applies to the real deployment — a Linux VM on the cluster
# network talks to slurmrestd and titan directly.
services:
  scheduler:
    environment:
      # Reach the tunnel on the Mac rather than the cluster directly.
      - SLURM_REST_URL=http://host.containers.internal:16820/slurm/v0.0.42
      - SLURM_TOKEN_MODE=command
      - SLURM_TOKEN_SSH_HOST=host.containers.internal
      - SLURM_TOKEN_SSH_PORT=12222
      - SLURM_TOKEN_SSH_USER=slurmweb
      - SLURM_TOKEN_SSH_KEY=/run/secrets/slurm_token_key
      - SLURM_TOKEN_SSH_KNOWN_HOSTS=/run/secrets/known_hosts
      - SLURM_TOKEN_LIFESPAN_SECONDS=3600
      # No previews without sbatch; the UI says "start time unknown".
      - ESTIMATE_BACKEND=
    volumes:
      # Host keys relabelled for the tunnel's host:port.
      - ./secrets/known_hosts.container:/run/secrets/known_hosts:ro
    extra_hosts:
      - "host.containers.internal:host-gateway"
